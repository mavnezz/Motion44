blueprint:
  name: Motion44
  description: >
    Bewegungsmelder schaltet Licht an, nach Verzögerung wieder aus.
    Zwei Profile (Abend/Nacht), Lux- und Sonnen-Check, optionaler Bypass via input_boolean Helper.
  domain: automation
  source_url: https://github.com/mavnezz/Motion44
  input:
    motion_sensors:
      name: Bewegungsmelder
      description: Ein oder mehrere binary_sensor Entitäten, die Bewegung melden.
      selector:
        entity:
          filter:
            domain: binary_sensor
          multiple: true

    lights:
      name: Lichter / Schalter
      description: Welche Lichter oder Schalter sollen geschaltet werden. Bitte einzelne Entitäten auswählen — keine Geräte/Bereiche.
      selector:
        entity:
          filter:
            - domain: light
            - domain: switch
          multiple: true

    no_motion_wait:
      name: Aus-Verzögerung
      description: Wie lange nach letzter Bewegung warten, bis das Licht ausgeht.
      default: 120
      selector:
        number:
          min: 5
          max: 1800
          step: 5
          unit_of_measurement: Sekunden
          mode: slider

    # ---------- Dunkel-Erkennung (Tor) ----------
    use_sun:
      name: Nur wenn Sonne unter Horizont
      default: false
      selector:
        boolean:

    use_illuminance:
      name: Lux-Sensor verwenden?
      default: false
      selector:
        boolean:

    illuminance_sensor:
      name: Lux-Sensor
      description: Helligkeitssensor (sensor mit device_class "illuminance"). Nur relevant, wenn "Lux-Sensor verwenden" aktiv ist.
      default: ""
      selector:
        entity:
          filter:
            domain: sensor
            device_class: illuminance

    lux_threshold:
      name: Lux-Schwellwert
      description: Licht schaltet nur, wenn der Lux-Wert UNTER diesem Wert liegt.
      default: 50
      selector:
        number:
          min: 0
          max: 1000
          step: 5
          unit_of_measurement: lx
          mode: slider

    # ---------- Helligkeit / Farbe (Toggles) ----------
    use_brightness:
      name: Helligkeit setzen?
      description: Wenn aktiviert, werden die Helligkeitswerte unten verwendet.
      default: false
      selector:
        boolean:

    use_color_temp:
      name: Farbtemperatur setzen?
      description: Wenn aktiviert, werden die Farbtemperatur-Werte unten verwendet (nur Lichter mit Tunable White).
      default: false
      selector:
        boolean:

    # ---------- Profil: Abend (Standard, wenn dunkel) ----------
    brightness_pct_evening:
      name: Helligkeit – Abend (%)
      description: Helligkeit außerhalb des Nacht-Zeitfensters.
      default: 100
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider

    color_temp_kelvin_evening:
      name: Farbtemperatur – Abend (K)
      default: 3000
      selector:
        number:
          min: 2000
          max: 6500
          step: 100
          unit_of_measurement: K
          mode: slider

    # ---------- Profil: Nacht (innerhalb Zeitfenster) ----------
    use_night_profile:
      name: Nacht-Profil verwenden?
      description: Innerhalb des Zeitfensters wird das Nacht-Profil verwendet (z.B. Toilettengang – dimmer, wärmer).
      default: false
      selector:
        boolean:

    night_window_start:
      name: Nacht-Profil Start
      default: "22:00:00"
      selector:
        time:

    night_window_end:
      name: Nacht-Profil Ende
      default: "06:00:00"
      selector:
        time:

    brightness_pct_night:
      name: Helligkeit – Nacht (%)
      default: 20
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider

    color_temp_kelvin_night:
      name: Farbtemperatur – Nacht (K)
      default: 2200
      selector:
        number:
          min: 2000
          max: 6500
          step: 100
          unit_of_measurement: K
          mode: slider

    # ---------- Bypass ----------
    use_bypass:
      name: Bypass aktivieren?
      description: >
        Wenn aktiviert, prüft die Automation den Status eines input_boolean Helpers.
        Solange dieser Helper "on" ist, schaltet die Automation das Licht weder ein noch aus.
        Den Helper schaltest du selbst — z.B. per Dashboard, Sprachbefehl, oder einer
        separaten kleinen Automation, die auf deine Remote-Tasten reagiert.
      default: false
      selector:
        boolean:

    bypass_helper:
      name: Bypass Helper (input_boolean)
      description: input_boolean, dessen Status den Bypass kontrolliert. Nur relevant, wenn "Bypass aktivieren" aktiv ist.
      default: ""
      selector:
        entity:
          filter:
            domain: input_boolean

    # ---------- Fernbedienung (optional, ZHA) ----------
    use_remote_bypass:
      name: Fernbedienung verwenden?
      description: >
        Master-Schalter für alle Fernbedienungs-Funktionen unten (Bypass ein/aus,
        Profil Abend/Nacht). Einzelne Funktionen deaktivierst du, indem du ihre
        Tasten-Aktion auf "none" setzt. Bypass-Funktionen erfordern zusätzlich einen
        gesetzten Bypass-Helper.
      default: false
      selector:
        boolean:

    remote:
      name: Fernbedienung (ZHA)
      description: Die ZHA-Fernbedienung, deren Tastendruck den Bypass umschalten soll. Nur relevant, wenn "Bypass per Fernbedienung umschalten" aktiv ist.
      default:
      selector:
        device:
          filter:
            - integration: zha

    bypass_on_action:
      name: Tasten-Aktion – Bypass EIN
      description: >
        Welche Tasten-Aktion der Fernbedienung den Bypass EINschaltet. Bei einem Hue Dimmer
        (RWL021/022) ist z.B. "on_long_release" = On-Taste lang gedrückt. "none" = nicht verwenden.
        Den exakten Wert deiner Remote findest du via Entwicklerwerkzeuge → Events → "zha_event" abhören.
      default: "on_long_release"
      selector:
        select:
          custom_value: true
          options: &remote_actions
            - "none"
            - "on_press"
            - "on_short_release"
            - "on_long_release"
            - "on_hold"
            - "up_press"
            - "up_short_release"
            - "up_long_release"
            - "up_hold"
            - "down_press"
            - "down_short_release"
            - "down_long_release"
            - "down_hold"
            - "off_press"
            - "off_short_release"
            - "off_long_release"
            - "off_hold"

    bypass_off_action:
      name: Tasten-Aktion – Bypass AUS
      description: >
        Welche Tasten-Aktion der Fernbedienung den Bypass AUSschaltet. Bei einem Hue Dimmer
        (RWL021/022) ist z.B. "off_long_release" = Off-Taste lang gedrückt. "none" = nicht verwenden.
      default: "off_long_release"
      selector:
        select:
          custom_value: true
          options: *remote_actions

    evening_profile_action:
      name: Tasten-Aktion – Profil Abend anwenden
      description: >
        Tastendruck, der die Lichter manuell auf das ABEND-Profil setzt (Helligkeit/Farbtemperatur
        Abend von oben). Unabhängig vom Bypass — praktisch z.B. mit der Heller-Taste (up).
        "none" = nicht verwenden.
      default: "up_short_release"
      selector:
        select:
          custom_value: true
          options: *remote_actions

    night_profile_action:
      name: Tasten-Aktion – Profil Nacht anwenden
      description: >
        Tastendruck, der die Lichter manuell auf das NACHT-Profil setzt (Helligkeit/Farbtemperatur
        Nacht von oben). Unabhängig vom Bypass — praktisch z.B. mit der Dunkler-Taste (down).
        "none" = nicht verwenden.
      default: "down_short_release"
      selector:
        select:
          custom_value: true
          options: *remote_actions

mode: restart
max_exceeded: silent

variables:
  use_brightness: !input use_brightness
  use_color_temp: !input use_color_temp
  brightness_pct_evening: !input brightness_pct_evening
  color_temp_kelvin_evening: !input color_temp_kelvin_evening
  use_night_profile: !input use_night_profile
  night_window_start: !input night_window_start
  night_window_end: !input night_window_end
  brightness_pct_night: !input brightness_pct_night
  color_temp_kelvin_night: !input color_temp_kelvin_night
  use_sun: !input use_sun
  use_illuminance: !input use_illuminance
  illuminance_sensor: !input illuminance_sensor
  lux_threshold: !input lux_threshold
  use_bypass: !input use_bypass
  bypass_helper: !input bypass_helper
  use_remote_bypass: !input use_remote_bypass
  bypass_on_action: !input bypass_on_action
  bypass_off_action: !input bypass_off_action
  evening_profile_action: !input evening_profile_action
  night_profile_action: !input night_profile_action
  in_night_window: >-
    {%- set s = strptime(night_window_start | string, '%H:%M:%S').time() -%}
    {%- set e = strptime(night_window_end | string, '%H:%M:%S').time() -%}
    {%- set t = now().time() -%}
    {{ (s <= e and s <= t < e) or (s > e and (t >= s or t < e)) }}
  active_brightness: "{{ brightness_pct_night if (use_night_profile and in_night_window) else brightness_pct_evening }}"
  active_color_temp: "{{ color_temp_kelvin_night if (use_night_profile and in_night_window) else color_temp_kelvin_evening }}"

triggers:
  - trigger: state
    entity_id: !input motion_sensors
    to: "on"
    id: motion_on
  - trigger: state
    entity_id: !input motion_sensors
    to: "off"
    for:
      seconds: !input no_motion_wait
    id: motion_off
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input remote
    id: remote_event

conditions: []

actions:
  - choose:
      # -------- Bewegung erkannt: Licht an --------
      - conditions:
          - condition: trigger
            id: motion_on
          - condition: template
            value_template: "{{ not use_bypass or bypass_helper in ['', none] or is_state(bypass_helper, 'off') }}"
          - condition: template
            value_template: "{{ not use_sun or is_state('sun.sun', 'below_horizon') }}"
          - condition: template
            value_template: "{{ not use_illuminance or (states(illuminance_sensor) | float(9999)) < lux_threshold }}"
        sequence:
          - action: "{{ 'light.turn_on' if (use_brightness or use_color_temp) else 'homeassistant.turn_on' }}"
            target:
              entity_id: !input lights
            data: >-
              {{
                ({'brightness_pct': active_brightness | int} if use_brightness else {})
                | combine({'color_temp_kelvin': active_color_temp | int} if use_color_temp else {})
              }}

      # -------- Keine Bewegung mehr: Licht aus --------
      - conditions:
          - condition: trigger
            id: motion_off
          - condition: template
            value_template: "{{ not use_bypass or bypass_helper in ['', none] or is_state(bypass_helper, 'off') }}"
        sequence:
          - action: homeassistant.turn_off
            target:
              entity_id: !input lights

      # -------- Fernbedienung: Bypass EINschalten --------
      - conditions:
          - condition: trigger
            id: remote_event
          - condition: template
            value_template: >-
              {{ use_remote_bypass
                 and bypass_helper not in ['', none]
                 and bypass_on_action not in ['', none, 'none']
                 and trigger.event.data.command == bypass_on_action }}
        sequence:
          - action: input_boolean.turn_on
            data:
              entity_id: "{{ bypass_helper }}"

      # -------- Fernbedienung: Bypass AUSschalten --------
      - conditions:
          - condition: trigger
            id: remote_event
          - condition: template
            value_template: >-
              {{ use_remote_bypass
                 and bypass_helper not in ['', none]
                 and bypass_off_action not in ['', none, 'none']
                 and trigger.event.data.command == bypass_off_action }}
        sequence:
          - action: input_boolean.turn_off
            data:
              entity_id: "{{ bypass_helper }}"

      # -------- Fernbedienung: Profil Abend anwenden --------
      - conditions:
          - condition: trigger
            id: remote_event
          - condition: template
            value_template: >-
              {{ use_remote_bypass
                 and evening_profile_action not in ['', none, 'none']
                 and trigger.event.data.command == evening_profile_action }}
        sequence:
          - action: "{{ 'light.turn_on' if (use_brightness or use_color_temp) else 'homeassistant.turn_on' }}"
            target:
              entity_id: !input lights
            data: >-
              {{
                ({'brightness_pct': brightness_pct_evening | int} if use_brightness else {})
                | combine({'color_temp_kelvin': color_temp_kelvin_evening | int} if use_color_temp else {})
              }}

      # -------- Fernbedienung: Profil Nacht anwenden --------
      - conditions:
          - condition: trigger
            id: remote_event
          - condition: template
            value_template: >-
              {{ use_remote_bypass
                 and night_profile_action not in ['', none, 'none']
                 and trigger.event.data.command == night_profile_action }}
        sequence:
          - action: "{{ 'light.turn_on' if (use_brightness or use_color_temp) else 'homeassistant.turn_on' }}"
            target:
              entity_id: !input lights
            data: >-
              {{
                ({'brightness_pct': brightness_pct_night | int} if use_brightness else {})
                | combine({'color_temp_kelvin': color_temp_kelvin_night | int} if use_color_temp else {})
              }}
